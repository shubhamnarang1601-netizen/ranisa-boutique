name: Ranisa Android APK
on:
  push:
    branches: [ranisa-android-app]
    paths: ['android-app/**', '.github/workflows/ranisa-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build and lint
        run: gradle :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native device smoke checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android-app
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w in.co.ranisaboutique.app.test/in.co.ranisaboutique.app.SmokeInstrumentation | tee smoke-results.txt
            grep -q "Native navigation and Google sign-in surface checks passed" smoke-results.txt
            adb pull /sdcard/Android/data/in.co.ranisaboutique.app/files/ranisa-home.png app/build/ranisa-home.png
      - uses: actions/upload-artifact@v4
        with:
          name: Ranisa-Boutique-debug-APK
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/ranisa-home.png
            android-app/smoke-results.txt
          if-no-files-found: error
          retention-days: 14
      - name: Check public backend contracts
        run: python3 checks.py
